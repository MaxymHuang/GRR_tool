[project]
name = "data-parser-app"
version = "0.1.0"
description = "Standalone CLI to parse and prepare Gage R&R measurement data (forked from grr-tool)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.4",
    "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
